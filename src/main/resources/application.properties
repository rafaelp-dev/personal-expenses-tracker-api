# Banco de dados
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexoes
spring.datasource.hikari.maximum-pool-size=${DATABASE_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DATABASE_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=${DATABASE_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.keepalive-time=${DATABASE_KEEPALIVE_TIME:120000}
spring.datasource.hikari.validation-timeout=${DATABASE_VALIDATION_TIMEOUT:5000}
spring.datasource.hikari.max-lifetime=${DATABASE_MAX_LIFETIME:1800000}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

app.auth.jwt-secret=${APP_AUTH_JWT_SECRET}
app.auth.jwt-expiration-seconds=${APP_AUTH_JWT_EXPIRATION_SECONDS}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

server.address=0.0.0.0
server.port=${PORT}
server.forward-headers-strategy=framework
server.error.include-stacktrace=never
