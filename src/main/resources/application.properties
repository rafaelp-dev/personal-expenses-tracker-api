# Banco de dados
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexoes
spring.datasource.hikari.maximum-pool-size=${DATABASE_MAX_POOL_SIZE}
spring.datasource.hikari.minimum-idle=${DATABASE_MIN_IDLE}
spring.datasource.hikari.connection-timeout=${DATABASE_CONNECTION_TIMEOUT}
spring.datasource.hikari.keepalive-time=${DATABASE_KEEPALIVE_TIME}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.auth.jwt-secret=${APP_AUTH_JWT_SECRET}
app.auth.jwt-expiration-seconds=${APP_AUTH_JWT_EXPIRATION_SECONDS}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

server.address=0.0.0.0
server.port=${PORT}
server.forward-headers-strategy=framework
server.error.include-stacktrace=never
