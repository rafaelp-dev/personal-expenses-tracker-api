# Banco de dados (Neon em producao; PostgreSQL local como fallback)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/personal-expenses-tracker}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool pequeno para evitar consumir conexoes desnecessarias no Neon
spring.datasource.hikari.maximum-pool-size=${DATABASE_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DATABASE_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=${DATABASE_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.keepalive-time=${DATABASE_KEEPALIVE_TIME:120000}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

app.auth.jwt-secret=${APP_AUTH_JWT_SECRET}
app.auth.jwt-expiration-seconds=${APP_AUTH_JWT_EXPIRATION_SECONDS:3600}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

server.address=0.0.0.0
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.error.include-stacktrace=never
